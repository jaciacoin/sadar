<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sadar ($SADAR) — For the forest, the animals, and the people.</title>
  <meta name="description" content="Sadar ($SADAR) is a cheerful orangutan from the forest, holding up three fingers: for the forest, for the animals, and for the people. Just a meme. NFA, DYOR.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b2a11; --ink:#f4f7e8; --accent:#7ed957; --card:#12351a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Nunito, system-ui, sans-serif;
      background: linear-gradient(180deg, #06210c 0%, #0f3a16 40%, #16341c 100%);
      color: var(--ink);
      text-align: center;
    }
    header img.banner { width: 100%; max-height: 280px; object-fit: cover; display: block; }
    main { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }
    .logo { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 12px 32px rgba(0,0,0,.35); background: #0b2a11; }
    h1 { font-family: Fredoka, Nunito, sans-serif; font-size: 2.4rem; margin: 20px 0 4px; }
    .ticker { color: #f5c542; font-weight: 800; font-size: 1.25rem; letter-spacing: .04em; }
    p.lead { font-size: 1.08rem; line-height: 1.55; margin: 18px 0; }
    .trio { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin: 16px 0 8px; }
    .trio span { background:#1b4a24; border-radius:999px; padding:8px 14px; font-weight:800; font-size:.9rem; }
    .card { background: var(--card); border-radius: 20px; padding: 18px 16px; margin: 22px 0; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .card h2 { margin: 0 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: #b7d989; }
    .ca { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86rem; word-break: break-all; }
    a { color: var(--accent); font-weight: 700; }
    footer { font-size: .85rem; color: #c5d6b4; margin-top: 28px; }
  </style>
</head>
<body>
  <header><img class="banner" src="banner.png" alt="Sadar $SADAR"></header>
  <main>
    <img class="logo" src="logo.png" alt="Sadar logo">
    <h1>Sadar</h1>
    <div class="ticker">$SADAR</div>
    <div class="trio">
      <span>For the forest</span>
      <span>For the animals</span>
      <span>For the people</span>
    </div>
    <p class="lead">A cheerful orangutan from the forest, holding up three fingers: for the forest, for the animals, and for the people.</p>
    <div class="card">
      <h2>Contract address</h2>
      <div class="ca" id="ca">To be added after launch</div>
    </div>
    <p><a id="pump" href="https://pump.fun">pump.fun</a></p>
    <footer>Just a meme. Not financial advice. DYOR.</footer>
  </main>
</body>
</html>
